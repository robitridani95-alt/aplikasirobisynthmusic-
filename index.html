<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robi Synth</title>
<style>
  :root{--gold:#e8a53a;--teal:#4fb3c0;--bg:#0b0b0e}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%}
  video{object-fit:cover;transform:scaleX(-1);filter:brightness(.72) contrast(1.05)}
  #top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;z-index:5;background:linear-gradient(#000a,transparent)}
  #brand{font-weight:800;letter-spacing:.14em;font-size:13px}
  #brand span{color:var(--gold)}
  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  select,button.sm{background:#000a;color:#fff;border:1px solid #fff3;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
  button.sm.on{border-color:var(--gold);color:var(--gold)}
  #chips{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 10px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,#000d);display:flex;flex-direction:column;gap:8px;align-items:center}
  #row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
  .chip{min-width:44px;text-align:center;padding:5px 6px;border-radius:8px;border:1px solid #fff2;background:#0009;font-size:12px;font-weight:700;line-height:1.15}
  .chip small{display:block;font-size:9px;font-weight:500;opacity:.6}
  .chip.act{background:var(--gold);color:#111;border-color:var(--gold)}
  .chip.act.mn{background:var(--teal);border-color:var(--teal)}
  #hint{font-size:11px;opacity:.65;text-align:center}
  #start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 45%,#0005,#0009),linear-gradient(120deg,#7c3aed,#ec4899,#f97316,#eab308,#10b981,#0ea5e9,#7c3aed);background-size:100% 100%,400% 400%;animation:bg 16s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #start h1{font-size:30px;letter-spacing:.16em;font-weight:800}
  #start h1 span{color:var(--gold)}
  #start p{max-width:340px;font-size:14px;line-height:1.5;opacity:.75}
  #go{background:var(--gold);color:#111;border:0;border-radius:999px;padding:14px 34px;font-size:16px;font-weight:800;cursor:pointer}
  #go:disabled{opacity:.5}
  #status{font-size:12px;opacity:.7;min-height:16px}
  #start{overflow:hidden;transition:opacity .6s}
  #start.out{opacity:0;pointer-events:none}
  #start.loading p,#start.loading #go{display:none}
  #bar{width:min(70vw,300px);height:6px;border-radius:9px;background:#fff2;overflow:hidden;display:none}
  #start.loading #bar{display:block}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
  #stairs{display:none;align-items:flex-end;gap:6px;height:130px}
  #start.loading #stairs{display:flex}
  #stairs span{display:flex;flex-direction:column;align-items:center;gap:5px;width:30px;font-size:10px;font-weight:700;opacity:.85}
  #stairs b{display:block;width:100%;height:calc(18px + var(--i)*11px);border-radius:6px;background:#fff2;transform-origin:bottom;animation:step 1.9s ease-in-out infinite;animation-delay:calc(var(--i)*.18s)}
  @keyframes step{0%,45%,100%{background:#fff2;transform:scaleY(1);box-shadow:none}8%,22%{background:var(--gold);transform:scaleY(1.07);box-shadow:0 0 14px var(--gold)}}
  @keyframes bg{0%,100%{background-position:0 0,0% 50%}50%{background-position:0 0,100% 50%}}
  #start>*:not(.nt){position:relative;z-index:1}
  #start h1{text-shadow:0 2px 16px #0008}
  .nt{position:absolute;bottom:-60px;z-index:0;font-weight:800;pointer-events:none;opacity:0;animation:up linear infinite}
  @keyframes up{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.85}50%{transform:translate(28px,-55vh) rotate(18deg)}100%{transform:translate(-20px,-120vh) rotate(-24deg);opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="fx"></canvas>
</div>

<div id="top">
  <div id="brand">Robi <span>SYNTH</span></div>
  <div class="ctl">
    <select id="genre" aria-label="Genre iringan"><option value="pop">Pop</option><option value="rnb">R&amp;B</option><option value="rock">Rock</option><option value="slow">Slow</option></select>
    <button class="sm on" id="beat">Iringan</button>
    <select id="snd" aria-label="Suara"><option value="piano">Piano</option><option value="epiano">Piano Listrik</option><option value="organ">Organ</option><option value="strings">Strings</option><option value="guitar">Gitar</option><option value="harp">Harpa</option><option value="music">Music Box</option><option value="pad">Pad</option><option value="synth">Synth</option></select>
    <select id="key" aria-label="Nada dasar"></select>
    <button class="sm" id="arp">Arpeggio</button>
  </div>
</div>

<div id="chips">
  <div id="row"></div>
  <div id="hint">Jumlah jari terangkat (kedua tangan) = chord · tangan lebih tinggi = suara lebih terang · pilih genre di atas</div>
</div>

<div id="start">
  <h1>Robi <span>SYNTH</span></h1>
  <p>Main chord musik virtual hanya dengan gestur jari. Angkat 1–10 jari di depan kamera, tiap jumlah jari memainkan chord berbeda.</p>
  <button id="go">Mulai</button>
  <div id="stairs"><span style="--i:0"><b></b>Do</span><span style="--i:1"><b></b>Re</span><span style="--i:2"><b></b>Mi</span><span style="--i:3"><b></b>Fa</span><span style="--i:4"><b></b>Sol</span><span style="--i:5"><b></b>La</span><span style="--i:6"><b></b>Si</span><span style="--i:7"><b></b>Do</span></div>
  <div id="status"></div>
  <div id="bar"><i></i></div>
</div>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $('cam'), cv = $('fx'), ctx = cv.getContext('2d');
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

/* ---------- chord map ---------- */
// jumlah jari → [offset semitone dari nada dasar, kualitas]
const MAP = {
  1:[0,'maj'], 2:[2,'min'], 3:[4,'min'], 4:[5,'maj'], 5:[7,'maj'],
  6:[9,'min'], 7:[11,'dim'], 8:[5,'min'], 9:[10,'maj'], 10:[7,'dom7']
};
const QUAL = {
  maj:{iv:[0,4,7],suf:''}, min:{iv:[0,3,7],suf:'m'},
  dim:{iv:[0,3,6],suf:'dim'}, dom7:{iv:[0,4,7,10],suf:'7'}
};
const COLORS = {maj:'#e8a53a', min:'#4fb3c0', dim:'#a78bfa', dom7:'#f0706a'};
let keyIdx = 4; // E

function chordFor(n){
  const [off,q] = MAP[n];
  const root = (keyIdx + off) % 12;
  const midiRoot = 48 + root;
  const notes = QUAL[q].iv.map(i => midiRoot + i);
  notes.push(midiRoot + 12);
  return {n, q, name: NOTE[root] + QUAL[q].suf, notes, root: midiRoot,
          label: QUAL[q].iv.map(i => NOTE[(root+i)%12]).join(' ')};
}

/* ---------- UI chips & key ---------- */
const keySel = $('key');
NOTE.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Key '+n;if(i===keyIdx)o.selected=true;keySel.appendChild(o)});
const chipEls = {};
function buildChips(){
  const row = $('row'); row.innerHTML='';
  for(let n=1;n<=10;n++){
    const c = chordFor(n);
    const d = document.createElement('div');
    d.className = 'chip' + (c.q==='min'||c.q==='dim' ? ' mn':'');
    d.innerHTML = c.name + '<small>' + n + ' jari</small>';
    row.appendChild(d); chipEls[n]=d;
  }
  markActive();
}
function markActive(){
  for(const n in chipEls) chipEls[n].classList.toggle('act', current && current.n==n);
}
keySel.addEventListener('change',()=>{
  keyIdx = +keySel.value; buildChips();
  if(current){ const n=current.n; current=null; setChord(n); }
});

/* ---------- audio ---------- */
let ac, master, analyser, group=null, brightness=0.5, arpOn=false, arpTimer=null, arpStep=0;
function initAudio(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = .8;
  analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .6;
  master.connect(comp); comp.connect(analyser); analyser.connect(ac.destination);
  // reverb sederhana (impulse noise)
  const len = ac.sampleRate*2.2, ir = ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv = ac.createConvolver(); conv.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = .28;
  master.connect(wet); wet.connect(conv); conv.connect(comp);
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
const cutoff = b => 350 + b*b*5200;


/* ---------- piano (sintesis aditif) ---------- */
let sound='piano';
const PARTS=[1,.62,.42,.27,.17,.11,.07];
function pianoVoice(m,t,dest,amp,len){
  const f0=mtof(m), oscs=[], hi=Math.min(1,Math.max(0,(m-36)/48));
  const D=(5.2-hi*3.4)*len;                         // nada rendah ringing lebih lama
  const B=.00035;                                    // inharmonisitas senar
  PARTS.forEach((a,i)=>{
    const k=i+1, fr=k*f0*Math.sqrt(1+B*k*k); if(fr>9000) return;
    [-2.5,2.5].forEach(det=>{                        // dua senar sedikit beda stem
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=fr; o.detune.value=det*(k>3?0:1);
      const g=ac.createGain(), pk=amp*a*(1-hi*.25)/2, dk=D/Math.pow(k,.7);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(pk,t+.004);
      g.gain.setTargetAtTime(0,t+.004,dk/4.2);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t+Math.min(D*1.6,9)); oscs.push(o);
    });
  });
  // bunyi palu (ketukan halus)
  const s=ac.createBufferSource(); s.buffer=noiseB();
  const nf=ac.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=Math.min(4000,f0*5); nf.Q.value=.8;
  const ng=ac.createGain(); ng.gain.setValueAtTime(amp*.5,t); ng.gain.exponentialRampToValueAtTime(.0005,t+.05);
  s.connect(nf); nf.connect(ng); ng.connect(dest); s.start(t); s.stop(t+.06);
  return oscs;
}

/* ---------- instrumen lain ---------- */
function env(t,dest,pk,dec,life){ // envelope petik: attack cepat, decay eksponensial
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(pk,t+.004);
  g.gain.setTargetAtTime(0,t+.004,dec/4.2); g.connect(dest); return g;
}
function pOsc(type,fr,t,dest,stop){
  const o=ac.createOscillator(); o.type=type; o.frequency.value=fr; o.connect(dest); o.start(t);
  if(stop) o.stop(stop); return o;
}
function vibrato(oscs,t){ // vibrato halus untuk strings/pad
  const l=ac.createOscillator(); l.frequency.value=4.8+Math.random()*1.2;
  const lg=ac.createGain(); lg.gain.value=7; l.connect(lg);
  oscs.forEach(o=>lg.connect(o.detune)); l.start(t); return l;
}
const VOICES={
  piano:pianoVoice,
  epiano(m,t,dest,amp,len){            // piano listrik ala Rhodes
    const f0=mtof(m), D=2.6*len, o=[];
    [[1,1,1],[2,.28,.55],[3,.1,.3]].forEach(([k,a,d])=>{
      o.push(pOsc('sine',f0*k,t,env(t,dest,amp*a,D*d,0),t+D*d*1.8+.2));
    });
    o.push(pOsc('sine',f0*7.02,t,env(t,dest,amp*.22,.18*len,0),t+.5)); // tine "bark"
    return o;
  },
  organ(m,t,dest,amp){                 // organ drawbar (sustain)
    const f0=mtof(m);
    return [[1,1],[2,.8],[3,.55],[4,.4],[6,.25],[8,.18]].map(([k,a])=>{
      const g=ac.createGain(); g.gain.value=amp*a*.55; g.connect(dest);
      return pOsc('sine',f0*k,t,g);
    });
  },
  strings(m,t,dest,amp){               // ensemble strings (sustain)
    const f0=mtof(m), o=[];
    [-13,0,13].forEach(d=>{
      const g=ac.createGain(); g.gain.value=amp*.34; g.connect(dest);
      const x=pOsc('sawtooth',f0,t,g); x.detune.value=d; o.push(x);
    });
    o.push(vibrato(o.slice(),t)); return o;
  },
  pad(m,t,dest,amp){                   // pad lembut (sustain)
    const f0=mtof(m), o=[];
    [['sine',0,1],['triangle',-6,.7],['triangle',6,.7],['sine',1200,.25]].forEach(([ty,d,a])=>{
      const g=ac.createGain(); g.gain.value=amp*a*.6; g.connect(dest);
      const x=pOsc(ty,f0,t,g); x.detune.value=d; o.push(x);
    });
    o.push(vibrato(o.slice(),t)); return o;
  },
  guitar(m,t,dest,amp,len){            // gitar petik akustik
    const f0=mtof(m), D=1.9*len;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=1.2;
    f.frequency.setValueAtTime(4200,t); f.frequency.setTargetAtTime(700,t,.09);
    const g=env(t,f,amp*1.1,D,0); f.connect(dest);
    return [pOsc('sawtooth',f0,t,g,t+D*1.8+.2), pOsc('triangle',f0*2,t,env(t,f,amp*.2,D*.5,0),t+D+.2),
            pOsc('sine',f0*.5,t,env(t,dest,amp*.25,D*.6,0),t+D+.2)];
  },
  harp(m,t,dest,amp,len){              // harpa
    const f0=mtof(m), D=2.8*len;
    return [[1,1,1],[2,.38,.6],[3,.17,.35],[4,.08,.2]].map(([k,a,d])=>
      pOsc(k===1?'triangle':'sine',f0*k,t,env(t,dest,amp*a,D*d,0),t+D*d*1.8+.2));
  },
  music(m,t,dest,amp,len){             // kotak musik / lonceng
    const f0=mtof(m+12);
    return [[1,1,1.5],[2.76,.45,.8],[5.4,.28,.45],[8.93,.14,.28]].map(([k,a,d])=>
      pOsc('sine',f0*k,t,env(t,dest,amp*a*.8,d*len,0),t+d*len*1.8+.2));
  }
};
const INSTR={
  piano :{amp:.2 ,strum:.012,bass:.26,att:0  ,cut:b=>cutoff(b)*1.6+600},
  epiano:{amp:.26,strum:.010,bass:.2 ,att:0  ,cut:b=>cutoff(b)*1.3+800},
  organ :{amp:.2 ,strum:0   ,bass:.22,att:.03,cut:b=>900+b*b*6500, sus:1},
  strings:{amp:.2,strum:0   ,bass:.0 ,att:.55,cut:b=>500+b*b*4200, sus:1},
  pad   :{amp:.22,strum:0   ,bass:.18,att:.9 ,cut:b=>350+b*b*2600, sus:1},
  guitar:{amp:.2 ,strum:.038,bass:.0 ,att:0  ,cut:b=>1400+b*b*6000},
  harp  :{amp:.26,strum:.07 ,bass:.0 ,att:0  ,cut:b=>1500+b*b*6500},
  music :{amp:.2 ,strum:.045,bass:.0 ,att:0  ,cut:b=>3000+b*b*7000}
};
function playInst(c){
  const I=INSTR[sound], V=VOICES[sound], t=ac.currentTime;
  const g=ac.createGain();
  if(I.att){ g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+I.att); } else g.gain.value=1;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=.7; f.frequency.value=I.cut(brightness);
  f.connect(g); g.connect(master);
  let oscs=[];
  c.notes.forEach((m,i)=>{ oscs=oscs.concat(V(m,t+i*I.strum,f,I.amp,1)) });
  if(I.bass) oscs=oscs.concat(V(c.root-12,t,f,I.bass,1.3));
  return {g,f,oscs,chord:c,cutf:I.cut};
}

function playChord(c){
  if(sound!=='synth') return playInst(c);
  const t = ac.currentTime;
  const g = ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.12);
  const f = ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=2.2; f.frequency.value = cutoff(brightness);
  f.connect(g); g.connect(master);
  const oscs=[];
  c.notes.forEach(m=>{
    [-7,7].forEach(det=>{
      const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=det;
      const og=ac.createGain(); og.gain.value=.16; o.connect(og); og.connect(f); o.start(t); oscs.push(o);
    });
  });
  const bass=ac.createOscillator(); bass.type='sine'; bass.frequency.value=mtof(c.root-12);
  const bg=ac.createGain(); bg.gain.value=.5; bass.connect(bg); bg.connect(g); bass.start(t); oscs.push(bass);
  return {g,f,oscs,chord:c};
}
function releaseGroup(gr,time=.45){
  if(!gr) return; const t=ac.currentTime;
  gr.g.gain.cancelScheduledValues(t); gr.g.gain.setValueAtTime(gr.g.gain.value,t);
  gr.g.gain.linearRampToValueAtTime(0,t+time);
  gr.oscs.forEach(o=>{try{o.stop(t+time+.05)}catch(e){}});
  setTimeout(()=>{try{gr.g.disconnect();gr.f.disconnect()}catch(e){}},(time+.2)*1000);
}
function pluck(m){
  const t=ac.currentTime;
  if(sound!=='synth'){
    const I=INSTR[sound];
    if(I.sus){
      const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.03); g.gain.linearRampToValueAtTime(0,t+.4); g.connect(master);
      VOICES[sound](m+12,t,g,I.amp,.4).forEach(o=>{try{o.stop(t+.45)}catch(e){}});
    } else VOICES[sound](m+12,t,master,I.amp,.45);
    return;
  }
  const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=mtof(m+12);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+.5);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.55);
}
const ARP = [0,1,2,3,2,1];
function arpStart(){
  clearInterval(arpTimer);
  arpTimer = setInterval(()=>{
    if(!arpOn||!current||!ac) return;
    pluck(current.notes[ARP[arpStep++%ARP.length] % current.notes.length]);
  },170);
}
$('snd').addEventListener('change',e=>{
  sound=e.target.value;
  if(current){ const n=current.n; current=null; setChord(n); }
});
$('arp').addEventListener('click',e=>{
  arpOn=!arpOn; e.currentTarget.classList.toggle('on',arpOn);
});

/* ---------- iringan band (drum + bass) ---------- */
const STYLES={
  pop :{bpm:112,sw:0  ,k:'x...x...x...x...',s:'....x.......x...',h:'x.x.x.x.x.x.x.xo',b:'r..r..r.r..r..5.',bt:'triangle',bd:1.6,hv:.05},
  rnb :{bpm:80 ,sw:.2 ,k:'x......x..x.....',s:'....x..g....x...',h:'x.xxx.xxx.xxx.xx',b:'r.....r...r..5..',bt:'sine',bd:3,hv:.04},
  rock:{bpm:126,sw:0  ,k:'x.....x.x.......',s:'....x.......x...',h:'x.x.x.x.x.x.x.xo',b:'r.r.r.r.r.r.r.r.',bt:'sawtooth',bd:1.6,hv:.06},
  slow:{bpm:66 ,sw:0  ,k:'x.........x.....',s:'........x.......',h:'x...x...x...x...',b:'r.......5.......',bt:'sine',bd:7,hv:.03}
};
let style='pop', beatOn=true, nextT=0, stepI=0, drumBus=null, noiseBuf=null;
function noiseB(){
  if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  return noiseBuf;
}
function nz(t,type,freq,vol,dec){
  const s=ac.createBufferSource(); s.buffer=noiseB();
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dec);
  s.connect(f); f.connect(g); g.connect(drumBus); s.start(t); s.stop(t+dec+.05);
}
function kick(t){
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
  o.connect(g); g.connect(drumBus); o.start(t); o.stop(t+.35);
}
function snare(t,v){
  nz(t,'bandpass',1900,.5*v,.18);
  const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=190;
  g.gain.setValueAtTime(.35*v,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
  o.connect(g); g.connect(drumBus); o.start(t); o.stop(t+.12);
}
function bassNote(t,m,dur,type){
  const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type=type; o.frequency.value=mtof(m); f.type='lowpass'; f.frequency.value=type==='sawtooth'?900:500;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.55,t+.012);
  g.gain.setValueAtTime(.55,t+dur*.7); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(f); f.connect(g); g.connect(drumBus); o.start(t); o.stop(t+dur+.05);
}
function sched(){
  if(!ac) return;
  const S=STYLES[style], sd=60/S.bpm/4;
  while(nextT<ac.currentTime+.12){
    if(beatOn){
      const i=stepI%16, t=nextT+(i%2?S.sw*sd:0);
      if(S.k[i]==='x') kick(t);
      if(S.s[i]==='x') snare(t,1); else if(S.s[i]==='g') snare(t,.3);
      if(S.h[i]==='x') nz(t,'highpass',7500,S.hv,.05);
      else if(S.h[i]==='o') nz(t,'highpass',7500,S.hv*1.3,.22);
      const b=S.b[i];
      if(b!=='.' && current) bassNote(t,current.root-12+(b==='5'?7:0),sd*S.bd,S.bt);
    }
    nextT+=sd; stepI++;
  }
}
function bandStart(){
  drumBus=ac.createGain(); drumBus.gain.value=.7; drumBus.connect(master);
  nextT=ac.currentTime+.1; stepI=0; setInterval(sched,25);
}
$('genre').addEventListener('change',e=>{style=e.target.value; stepI=0; if(ac) nextT=ac.currentTime+.08});
$('beat').addEventListener('click',e=>{beatOn=!beatOn; e.currentTarget.classList.toggle('on',beatOn); stepI=0; if(ac) nextT=ac.currentTime+.08});

/* ---------- chord state ---------- */
let current=null, hue=COLORS.maj, fade=0;
function setChord(n){
  if(!ac) return;
  if(n===0 || !MAP[n]){
    if(group){releaseGroup(group); group=null}
    current=null; markActive(); return;
  }
  if(current && current.n===n) return;
  const c = chordFor(n);
  releaseGroup(group,.35);
  group = playChord(c);
  current = c; hue = COLORS[c.q]; markActive();
}

/* ---------- hand tracking ---------- */
let landmarker=null, hands=[], lastT=-1;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function countFingers(lm){
  const size = dist(lm[0],lm[9]) || 1e-3;
  let n=0; const up=[];
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip,pip])=>{
    const ok = dist(lm[tip],lm[0]) > dist(lm[pip],lm[0])*1.08;
    if(ok){n++; up.push(tip)}
  });
  const th = dist(lm[4],lm[17]) > dist(lm[3],lm[17])*1.08 && dist(lm[4],lm[5]) > size*.5;
  if(th){n++; up.push(4)}
  return {n,up};
}
let cand=0, candCount=0;
function decide(total){
  if(total===cand) candCount++; else {cand=total; candCount=1}
  if(candCount>=4){
    const t = Math.min(total,10);
    if((current?current.n:0)!==t) setChord(t);
  }
}

async function loadModel(){
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const base = {modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"};
  try{
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{...base,delegate:"GPU"},runningMode:"VIDEO",numHands:2});
  }catch(e){
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{...base,delegate:"CPU"},runningMode:"VIDEO",numHands:2});
  }
}

/* ---------- render ---------- */
function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*d; cv.height=innerHeight*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize();

function mapPt(p){
  const vw=video.videoWidth||1, vh=video.videoHeight||1, cw=innerWidth, ch=innerHeight;
  const s=Math.max(cw/vw,ch/vh);
  const px=p.x*vw*s-(vw*s-cw)/2, py=p.y*vh*s-(vh*s-ch)/2;
  return {x:cw-px,y:py};
}

const wave=new Uint8Array(1024);
function draw(){
  requestAnimationFrame(draw);
  if(landmarker && video.readyState>=2 && video.currentTime!==lastT){
    lastT=video.currentTime;
    const r=landmarker.detectForVideo(video,performance.now());
    hands=r.landmarks||[];
    let total=0, ySum=0;
    hands.forEach(lm=>{total+=countFingers(lm).n; ySum+=lm[0].y});
    decide(hands.length?total:0);
    if(hands.length){
      const b = 1-Math.min(1,Math.max(0,(ySum/hands.length-.25)/.6));
      brightness += (b-brightness)*.2;
      if(group) group.f.frequency.setTargetAtTime((group.cutf||cutoff)(brightness),ac.currentTime,.05);
    }
  }
  const w=innerWidth,h=innerHeight;
  ctx.clearRect(0,0,w,h);

  // titik landmark tangan
  hands.forEach(lm=>{
    const up=countFingers(lm).up;
    lm.forEach((p,i)=>{
      const m=mapPt(p), tip=up.includes(i);
      ctx.beginPath(); ctx.arc(m.x,m.y,tip?4.5:2.6,0,7);
      ctx.fillStyle=tip?hue:'rgba(255,255,255,.92)';
      ctx.shadowColor=tip?hue:'#fff'; ctx.shadowBlur=tip?10:4;
      ctx.fill();
    });
  });
  ctx.shadowBlur=0;

  // gelombang audio + label chord
  const cy=h*0.7;
  let amp=0;
  if(analyser){ analyser.getByteTimeDomainData(wave); }
  fade += ((current?1:0)-fade)*.12;
  ctx.lineWidth=1.6; ctx.strokeStyle=hue; ctx.globalAlpha=.35+.55*fade;
  ctx.beginPath();
  const step=Math.max(1,Math.floor(1024/ (w/3)));
  for(let x=0,i=0;x<=w;x+=3,i+=step){
    const v=analyser?(wave[Math.min(i,1023)]-128)/128:0;
    const edge=Math.min(1,Math.min(x,w-x)/(w*.2));
    const y=cy+v*70*edge*fade + Math.sin(x*.012+performance.now()*.002)*3*(1-fade)*edge;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke(); ctx.globalAlpha=1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 56px "Arial Narrow",Impact,system-ui,sans-serif';
  ctx.fillStyle=current?hue:'rgba(255,255,255,.35)';
  ctx.shadowColor='#000a'; ctx.shadowBlur=12;
  ctx.fillText(current?current.name:'—',w/2,cy);
  ctx.shadowBlur=0;
  ctx.font='500 11px system-ui,sans-serif'; ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(current?current.label:(hands.length?'0 jari':'tunjukkan tangan'),w/2,cy+38);
}

/* ---------- start ---------- */
const SYM=['♪','♫','♩','♬','Do','Re','Mi','Fa','Sol','La','Si'], NC=['#fff','#ffe66d','#9ef0ff','#ffd1f0','#c8ffb0'];
for(let i=0;i<44;i++){const n=document.createElement('span');n.className='nt';n.textContent=SYM[i%SYM.length];
  const sol=n.textContent.length>1;
  n.style.cssText='left:'+Math.random()*96+'%;color:'+NC[i%NC.length]+';font-size:'+(sol?12+Math.random()*8:20+Math.random()*34)+'px;animation-duration:'+(7+Math.random()*9)+'s;animation-delay:'+(-Math.random()*16)+'s;text-shadow:0 0 10px currentColor';
  $('start').appendChild(n)}
$('go').addEventListener('click',async()=>{
  const btn=$('go'), st=$('status'), sc=$('start'); let tm; btn.disabled=true; sc.classList.add('loading');
  const prog=(p,t)=>{st.textContent=t;$('bar').firstElementChild.style.width=p+'%'};
  try{
    prog(10,'Mengaktifkan audio…'); initAudio(); await ac.resume();
    prog(30,'Meminta akses kamera…');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play();
    let pp=55; prog(pp,'Memuat model hand tracking…'); tm=setInterval(()=>{pp=Math.min(92,pp+1.5);prog(pp,'Memuat model hand tracking…')},200);
    landmarker=await loadModel(); clearInterval(tm);
    buildChips(); arpStart(); bandStart();
    prog(100,'Siap! 🎶'); draw();
    await new Promise(r=>setTimeout(r,700)); sc.classList.add('out'); setTimeout(()=>sc.remove(),700);
  }catch(err){
    console.error(err);
    st.textContent='Gagal: '+(err.message||err)+'. Pastikan izin kamera aktif dan buka lewat https.';
    clearInterval(tm); sc.classList.remove('loading'); btn.disabled=false;
  }
});
buildChips();
</script>
